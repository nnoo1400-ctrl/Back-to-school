<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="وصف موجز ودقيق لمحتوى الصفحة" />
    <meta name="author" content="اسم المؤلف" />
    <title>عنوان الصفحة</title>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- الأنماط -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- الترويسة -->
    <header>
      <nav aria-label="القائمة الرئيسية">
        <ul>
          <li><a href="#home">الرئيسية</a></li>
          <li><a href="#about">عن الموقع</a></li>
          <li><a href="#contact">تواصل معنا</a></li>
        </ul>
      </nav>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
      <!-- قسم الترحيب -->
      <section id="home" aria-labelledby="home-title">
        <h1 id="home-title">مرحباً بك في موقعنا</h1>
        <p>
          هذه فقرة تمهيدية تعرّف الزائر بمحتوى الصفحة بشكل واضح وموجز.
        </p>
        <img
          src="image.webp"
          alt="وصف الصورة للوصولية"
          loading="lazy"
          width="800"
          height="600"
        />
      </section>

      <!-- قسم المعلومات -->
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">عن الموقع</h2>
        <article>
          <h3>عنوان فرعي</h3>
          <p>محتوى المقال أو المعلومات التفصيلية هنا.</p>
        </article>
      </section>

      <!-- قسم التواصل -->
      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">تواصل معنا</h2>
        <form action="#" method="post">
          <div>
            <label for="name">الاسم:</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div>
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="message">الرسالة:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
          </div>
          <button type="submit">إرسال</button>
        </form>
      </section>
    </main>

    <!-- التذييل -->
    <footer>
      <p>&copy; 2026 — جميع الحقوق محفوظة</p>
    </footer>

    <!-- السكربت -->
    <script type="module" src="main.js"></script>
  </body>
</html>
